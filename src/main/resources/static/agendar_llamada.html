<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlan - Agendar Videollamada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f7f4; }
        .btn-primary { background-color: #0077b6; color: white; transition: background-color 0.3s ease; }
        .btn-primary:hover { background-color: #023e8a; }
    </style>
</head>
<body class="antialiased text-gray-800">
    <header class="bg-white shadow-sm">
        <nav class="container mx-auto px-6 h-16 flex items-center justify-between">
            <div class="text-2xl font-bold text-[#0077b6]">Mathlan - Portal Docente</div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-10">
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold text-gray-900">Agendar Videollamada</h1>
            <p id="info-consulta" class="text-gray-600 mt-1">Selecciona la fecha y hora para la sesión.</p>

            <div id="message-container" class="hidden p-4 rounded-md text-sm my-4"></div>

            <form id="schedule-form" class="mt-6">
                <div class="space-y-6">
                    <div>
                        <label for="fecha" class="block text-sm font-semibold text-gray-900">Fecha de la llamada</label>
                        <input type="date" id="fecha" required class="mt-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                    <div>
                        <label for="hora" class="block text-sm font-semibold text-gray-900">Hora de la llamada</label>
                        <input type="time" id="hora" required class="mt-2 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                </div>
                <div class="mt-8 flex justify-end gap-4">
                    <a href="/dashboard_docente.html" class="px-4 py-2 text-sm font-semibold rounded-md">Cancelar</a>
                    <button type="submit" class="rounded-md btn-primary px-4 py-2 font-semibold text-white shadow-sm">Confirmar y Notificar</button>
                </div>
            </form>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('jwtToken');
            if (!token) { window.location.href = '/login.html'; return; }
            const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

            const urlParams = new URLSearchParams(window.location.search);
            const consultaId = urlParams.get('consultaId');
            if (!consultaId) {
                document.querySelector('main').innerHTML = '<p class="text-red-500">Error: No se especificó ID de consulta.</p>';
                return;
            }
            
            document.getElementById('info-consulta').textContent += ` (Consulta #${consultaId})`;

            const scheduleForm = document.getElementById('schedule-form');
            const messageContainer = document.getElementById('message-container');

            scheduleForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fecha = document.getElementById('fecha').value;
                const hora = document.getElementById('hora').value;

                // Combinamos fecha y hora en un objeto Date de JavaScript
                const fechaHoraISO = `${fecha}T${hora}:00`;
                const fechaHora = new Date(fechaHoraISO);

                try {
                    const response = await fetch(`/api/docente/consultas/${consultaId}/agendar`, {
                        method: 'POST',
                        headers,
                        // --- ¡CAMBIO CLAVE PARA CORREGIR EL ERROR! ---
                        // Enviamos la fecha como un número (timestamp en milisegundos)
                        body: JSON.stringify({ fechaHora: fechaHora.getTime() })
                    });

                    if (!response.ok) { 
                        // Intenta leer el mensaje de error del backend si lo hay
                        const errorData = await response.text();
                        throw new Error(errorData || 'No se pudo agendar la llamada.'); 
                    }

                    messageContainer.className = 'p-4 rounded-md text-sm my-4 bg-green-100 text-green-800';
                    messageContainer.textContent = '¡Llamada agendada y notificada! Redirigiendo...';
                    messageContainer.classList.remove('hidden');

                    setTimeout(() => window.location.href = '/dashboard_docente.html', 2000);

                } catch (error) {
                    messageContainer.className = 'p-4 rounded-md text-sm my-4 bg-red-100 text-red-800';
                    messageContainer.textContent = error.message;
                    messageContainer.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
