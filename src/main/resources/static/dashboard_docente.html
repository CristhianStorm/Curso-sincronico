<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlan - Portal del Docente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f7f4; 
        }
        .tab-link { 
            transition: all 0.2s ease-in-out; 
            border-bottom: 2px solid transparent; 
            cursor: pointer; 
        }
        .tab-link.active { 
            border-color: #0077b6; 
            color: #0077b6; 
            font-weight: 600; 
        }
        .btn { 
            padding: 0.5rem 1rem; 
            border-radius: 0.5rem; 
            font-weight: 600; 
            transition: all 0.2s; 
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-primary { 
            background-color: #0077b6; 
            color: white; 
        }
        .btn-primary:hover { 
            background-color: #023e8a; 
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div id="app" class="min-h-screen">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="text-2xl font-bold text-[#0077b6]">Mathlan<span class="text-[#023e8a]"></span> - Portal Docente</div>
                    <div class="flex items-center">
                        <button id="logout-button" class="text-sm font-semibold text-red-600 hover:text-red-800">Cerrar Sesión</button>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <h1 class="text-3xl font-bold tracking-tight mb-6">Bandeja de Consultas</h1>
            <div class="border-b border-gray-200 mb-6">
                <nav class="-mb-px flex space-x-6">
                    <a data-status="Pendiente" class="tab-link active py-4 px-1 text-sm font-medium text-gray-500">Nuevas Consultas</a>
                    <a data-status="Atendidas" class="tab-link py-4 px-1 text-sm font-medium text-gray-500">Consultas Atendidas</a>
                </nav>
            </div>
            <div id="questions-queue" class="space-y-5"></div>
        </main>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('jwtToken');
        if (!token) { window.location.href = '/login.html'; return; }
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        
        const queueContainer = document.getElementById('questions-queue');
        const tabs = document.querySelectorAll('.tab-link');
        let allQuestions = [];
        let currentStatusFilter = 'Pendiente';

        const fetchConsultas = async () => {
            try {
                const response = await fetch('/api/docente/consultas', { headers });
                if (response.status === 403) { throw new Error("Acceso denegado. No tienes permiso para ver esta página."); }
                if (!response.ok) { throw new Error('Error al cargar las consultas.'); }
                allQuestions = await response.json();
                renderQuestions();
            } catch (error) {
                queueContainer.innerHTML = `<div class="bg-white p-8 rounded-lg shadow text-center text-red-600">${error.message}</div>`;
            }
        };

        const renderQuestions = () => {
            queueContainer.innerHTML = '';
            
            // --- ¡FILTRO ACTUALIZADO! ---
            // Ahora también muestra el nuevo estado "Agendada" en la pestaña de "Nuevas Consultas"
            const filteredQuestions = allQuestions.filter(q => {
                if (currentStatusFilter === 'Pendiente') {
                    return ['Pendiente', 'Llamada en curso', 'Agendada'].includes(q.estado);
                }
                return q.estado === 'Respondida'; // Pestaña de Atendidas
            });

            if (filteredQuestions.length === 0) {
                queueContainer.innerHTML = `<div class="bg-white p-8 rounded-lg shadow text-center text-gray-500">No hay consultas en esta bandeja.</div>`;
                return;
            }

            filteredQuestions.forEach(q => {
                const callBadge = q.solicitaLlamada === 'S' ? `<span class="inline-flex items-center rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-800">📞 Requiere Llamada</span>` : '';
                
                // --- ¡LÓGICA DE BOTONES COMPLETAMENTE ACTUALIZADA! ---
                let actions = '';
                if (q.estado === 'Pendiente' && q.solicitaLlamada === 'S') {
                    // 1. Si requiere llamada y está pendiente, mostramos el botón para agendar.
                    actions = `<a href="/agendar_llamada.html?consultaId=${q.id}" class="btn bg-amber-500 hover:bg-amber-600 text-white">Agendar Llamada</a>`;
                
                } else if (q.estado === 'Agendada') {
                    // 2. Si ya está agendada, mostramos la fecha y el botón para iniciar la llamada.
                    const fechaAgendada = new Date(q.fechaLlamadaAgendada).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
                    actions = `<div class="text-right">
                                 <p class="text-sm font-semibold text-gray-700">Agendada: ${fechaAgendada} hs.</p>
                                 <button data-id="${q.id}" class="start-call-btn btn btn-primary mt-2">Iniciar Llamada Ahora</button>
                               </div>`;

                } else if (q.estado === 'Pendiente') {
                    // 3. Si está pendiente pero no requiere llamada, va directo al informe.
                    actions = `<a href="/informe_docente.html?consultaId=${q.id}" class="btn btn-primary">Crear Informe</a>`;

                } else if (q.estado === 'Llamada en curso') {
                    // 4. Si la llamada ya inició, permite reunirse.
                     actions = `<a href="/llamada.html?sala=${q.salaLlamada}&consultaId=${q.id}&role=docente" class="btn bg-green-500 hover:bg-green-700 text-white">Reunirse a la Llamada</a>`;

                } else { // estado === 'Respondida'
                    // 5. Si ya se respondió, no hay más acciones.
                    actions = `<span class="text-sm font-semibold text-green-600">Informe Enviado</span>`;
                }

                const cardHTML = `<div class="bg-white p-5 rounded-lg shadow">
                                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                                        <div class="flex-grow">
                                            <div class="flex items-center gap-4 mb-2">
                                                <p class="text-sm font-bold">Estudiante ID: ${q.idEstudiante}</p>
                                                ${callBadge}
                                            </div>
                                            <h3 class="text-lg font-semibold text-gray-900">${q.titulo}</h3>
                                            <p class="text-sm text-gray-500 mt-1">${q.materia}</p>
                                        </div>
                                        <div class="flex-shrink-0 mt-4 sm:mt-0">
                                            ${actions}
                                        </div>
                                    </div>
                                  </div>`;
                queueContainer.innerHTML += cardHTML;
            });
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', e => {
                currentStatusFilter = e.target.dataset.status === 'Atendidas' ? 'Respondida' : 'Pendiente';
                tabs.forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                renderQuestions();
            });
        });
        
        queueContainer.addEventListener('click', async e => {
            // El botón de "Iniciar Llamada" ahora sirve tanto para consultas agendadas como las que no
            if (e.target.classList.contains('start-call-btn')) {
                const consultaId = e.target.dataset.id;
                try {
                    const response = await fetch(`/api/docente/consultas/${consultaId}/iniciar-llamada`, {
                        method: 'POST',
                        headers
                    });
                    if (!response.ok) throw new Error('No se pudo iniciar la sala.');
                    const updatedConsulta = await response.json();
                    window.location.href = `/llamada.html?sala=${updatedConsulta.salaLlamada}&consultaId=${consultaId}&role=docente`;
                } catch (error) {
                    alert(error.message);
                }
            }
        });
        
        document.getElementById('logout-button').addEventListener('click', () => {
            localStorage.removeItem('jwtToken');
            window.location.href = '/';
        });

        await fetchConsultas();
    });
    </script>
</body>
</html>
