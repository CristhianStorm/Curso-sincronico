<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlan - Completar Informe de Progreso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f7f4; 
        }
        .btn-primary { 
            background-color: #0077b6; 
            color: white; 
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover { 
            background-color: #023e8a; 
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <header class="bg-white shadow-sm">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="text-2xl font-bold text-[#0077b6]">Mathlan<span class="text-[#023e8a]"></span> - Portal Docente</div>
        </nav>
    </header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div id="form-container" class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <div class="border-b pb-4 mb-6">
                <h1 class="text-2xl font-bold text-gray-900">Informe de Progreso Académico</h1>
                <p id="info-consulta" class="text-gray-600 mt-1">Completando el resumen de la consulta.</p>
            </div>
            
            <div id="message-container" class="hidden p-4 rounded-md text-sm mb-4"></div>

            <form id="feedback-form">
                <fieldset class="mb-8">
                    <legend class="text-lg font-semibold border-b w-full pb-2 mb-4">Resumen del Progreso</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="participacionGeneral" class="block text-sm font-medium">Participación general</label>
                            <select id="participacionGeneral" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                                <option>Alta</option><option>Media</option><option>Baja</option>
                            </select>
                        </div>
                        <div>
                            <label for="cumplimientoTareas" class="block text-sm font-medium">Cumplimiento de tareas</label>
                            <input type="text" id="cumplimientoTareas" placeholder="Ej: 90% completadas" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        </div>
                        <div>
                            <label for="nivelAvance" class="block text-sm font-medium">Nivel de avance en contenidos</label>
                            <input type="text" id="nivelAvance" placeholder="Ej: Álgebra básica" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        </div>
                        <div>
                            <label for="desempenoPromedio" class="block text-sm font-medium">Desempeño promedio</label>
                            <input type="text" id="desempenoPromedio" placeholder="Ej: 85% de aciertos" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="mb-8">
                    <legend class="text-lg font-semibold border-b w-full pb-2 mb-4">Evaluación de Desempeño</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="resolucionProblemas" class="block text-sm font-medium">Resolución de problemas</label>
                            <select id="resolucionProblemas" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                                <option>Excelente</option><option>Bueno</option><option>Regular</option><option>En proceso</option>
                            </select>
                        </div>
                        <div>
                            <label for="razonamientoLogico" class="block text-sm font-medium">Razonamiento lógico</label>
                            <select id="razonamientoLogico" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                                <option>Excelente</option><option>Bueno</option><option>Regular</option><option>En proceso</option>
                            </select>
                        </div>
                        <div>
                            <label for="calculoOperaciones" class="block text-sm font-medium">Cálculo y operaciones</label>
                            <select id="calculoOperaciones" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                                <option>Excelente</option><option>Bueno</option><option>Regular</option><option>En proceso</option>
                            </select>
                        </div>
                        <div>
                            <label for="participacionPlataforma" class="block text-sm font-medium">Participación en plataforma</label>
                            <select id="participacionPlataforma" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                                <option>Excelente</option><option>Bueno</option><option>Regular</option><option>En proceso</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <div>
                    <label for="observaciones" class="block text-sm font-semibold text-gray-900">Observaciones del Docente</label>
                    <textarea id="observaciones" required rows="4" class="mt-2 block w-full rounded-md border-gray-300 shadow-sm" placeholder="Comentarios personalizados sobre el progreso..."></textarea>
                </div>

                <div class="mt-8">
                    <button type="submit" class="w-full rounded-md btn-primary px-4 py-3 font-semibold text-white shadow-sm">Guardar y Enviar Informe</button>
                </div>
            </form>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('jwtToken');
            if (!token) { window.location.href = '/login.html'; return; }
            const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

            const urlParams = new URLSearchParams(window.location.search);
            const consultaId = urlParams.get('consultaId');

            if (!consultaId) {
                document.querySelector('main').innerHTML = '<p class="text-red-500">Error: No se especificó un ID de consulta.</p>';
                return;
            }
            
            document.getElementById('info-consulta').textContent = `Completando el resumen de la consulta #${consultaId}.`;

            const feedbackForm = document.getElementById('feedback-form');
            const messageContainer = document.getElementById('message-container');

            feedbackForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = {
                    observacionesDocente: document.getElementById('observaciones').value,
                    participacionGeneral: document.getElementById('participacionGeneral').value,
                    cumplimientoTareas: document.getElementById('cumplimientoTareas').value,
                    nivelAvance: document.getElementById('nivelAvance').value,
                    desempenoPromedio: document.getElementById('desempenoPromedio').value,
                    resolucionProblemas: document.getElementById('resolucionProblemas').value,
                    razonamientoLogico: document.getElementById('razonamientoLogico').value,
                    calculoOperaciones: document.getElementById('calculoOperaciones').value,
                    participacionPlataforma: document.getElementById('participacionPlataforma').value,
                };

                try {
                    const response = await fetch(`/api/docente/consultas/${consultaId}/informe`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(formData)
                    });

                    if (!response.ok) { throw new Error('No se pudo guardar el informe.'); }

                    messageContainer.className = 'p-4 rounded-md text-sm mb-4 bg-green-100 text-green-800';
                    messageContainer.textContent = '¡Informe enviado con éxito! Redirigiendo al dashboard...';
                    messageContainer.classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = '/dashboard_docente.html';
                    }, 2000);

                } catch (error) {
                    messageContainer.className = 'p-4 rounded-md text-sm mb-4 bg-red-100 text-red-800';
                    messageContainer.textContent = error.message;
                    messageContainer.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
