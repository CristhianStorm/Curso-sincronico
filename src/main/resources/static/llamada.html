<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlan - Sala de Videollamada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Simplificado: Solo lo necesario para Jitsi */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #meet { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="meet"></div>

    <script src="https://8x8.vc/vpaas-magic-cookie-729aea9cf02f4196a678547036578959/external_api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('jwtToken');
            if (!token) { window.location.href = '/login.html'; return; }
            const headers = { 'Authorization': `Bearer ${token}` };

            const urlParams = new URLSearchParams(window.location.search);
            const roomName = urlParams.get('sala');
            const consultaId = urlParams.get('consultaId');
            const role = urlParams.get('role');

            if (!roomName) {
                document.body.innerHTML = '<h1>Error: Nombre de sala no especificado.</h1>';
                return;
            }

            try {
                const tokenResponse = await fetch('/api/jitsi/token', { headers });
                if (!tokenResponse.ok) throw new Error('No se pudo obtener el token para la videollamada.');
                const { token: jitsiToken } = await tokenResponse.json();

                const domain = '8x8.vc';
                const options = {
                    roomName: `vpaas-magic-cookie-729aea9cf02f4196a678547036578959/${roomName}`,
                    width: '100%',
                    height: '100%',
                    parentNode: document.querySelector('#meet'),
                    jwt: jitsiToken
                };
                
                const api = new JitsiMeetExternalAPI(domain, options);
                
                // --- CÓDIGO DEL BOTÓN PERSONALIZADO ELIMINADO ---
                // Ya no necesitamos obtener el botón ni añadirle un 'click listener'.

                // El "oyente" que hace toda la magia se queda.
                api.addEventListener('videoConferenceLeft', () => {
                    if (role === 'docente') {
                        window.location.href = `/informe_docente.html?consultaId=${consultaId}`;
                    } else {
                        window.location.href = '/dashboard_estudiante.html';
                    }
                });

            } catch (error) {
                document.body.innerHTML = `<h1>Error al iniciar la llamada: ${error.message}</h1>`;
            }
        });
    </script>
</body>
</html>
