<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlan - Crear Cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f7f4; }
        .form-card { background-color: white; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #0077b6; color: white; transition: background-color 0.3s ease; }
        .btn-primary:hover { background-color: #023e8a; }
        .tutor-section {
            transition: all 0.5s ease-in-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }
        .tutor-section.visible {
            max-height: 500px; /* Suficiente altura para el contenido */
            opacity: 1;
            margin-top: 1.5rem; /* 24px */
            padding-top: 1.5rem; /* 24px */
            border-top: 1px solid #e5e7eb; /* tailwind gray-200 */
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="form-card max-w-2xl w-full p-8">
            <div>
                <h1 class="text-2xl font-bold text-center text-gray-900">Crea tu Cuenta para Empezar</h1>
                <p class="text-center text-gray-600 mt-2">Completa tus datos para continuar.</p>
            </div>
            
            <form id="registration-form" class="mt-8 space-y-6">
                <!-- Zona de Mensajes de Error/Éxito -->
                <div id="message-container" class="hidden p-4 rounded-md text-sm"></div>

                <fieldset>
                    <legend class="text-lg font-semibold text-gray-800 border-b w-full pb-2 mb-4">Datos del Estudiante</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                        <div><label for="student-name" class="block text-sm font-medium text-gray-900">Nombre Completo</label><input type="text" id="student-name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#0077b6] focus:ring-[#0077b6] sm:text-sm"></div>
                        <div><label for="student-email" class="block text-sm font-medium text-gray-900">Correo Electrónico</label><input type="email" id="student-email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#0077b6] focus:ring-[#0077b6] sm:text-sm"></div>
                        <div><label for="student-age" class="block text-sm font-medium text-gray-900">Edad</label><input type="number" id="student-age" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#0077b6] focus:ring-[#0077b6] sm:text-sm"></div>
                        <div><label for="student-id" class="block text-sm font-medium text-gray-900">Cédula de Identidad</label><input type="text" id="student-id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#0077b6] focus:ring-[#0077b6] sm:text-sm"></div>
                        <div class="md:col-span-2"><label for="student-password" class="block text-sm font-medium text-gray-900">Contraseña (mínimo 8 caracteres)</label><input type="password" id="student-password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#0077b6] focus:ring-[#0077b6] sm:text-sm"></div>
                    </div>
                </fieldset>
                
                <!-- Sección del Tutor (se muestra con JS) -->
                <div id="tutor-section" class="tutor-section">
                    <fieldset>
                        <legend class="text-lg font-semibold text-red-600 border-b w-full pb-2 mb-4">Datos del Padre, Madre o Tutor</legend>
                        <p class="text-sm text-gray-600 mb-4">Al ser menor de edad, es necesario que un adulto responsable autorice la cuenta.</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                            <div><label for="tutor-name" class="block text-sm font-medium text-gray-900">Nombre Completo del Tutor</label><input type="text" id="tutor-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></div>
                            <div><label for="tutor-email" class="block text-sm font-medium text-gray-900">Correo Electrónico del Tutor</label><input type="email" id="tutor-email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></div>
                            <div><label for="tutor-relationship" class="block text-sm font-medium text-gray-900">Parentesco</label><select id="tutor-relationship" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"><option>Madre</option><option>Padre</option><option>Tutor Legal</option></select></div>
                        </div>
                    </fieldset>
                </div>
                
                <div><button type="submit" class="w-full btn-primary font-bold py-3 rounded-lg">Crear Cuenta</button></div>
            </form>
        </div>
    </div>

    <!-- El JavaScript que le da vida al formulario -->
    <script>
        const studentAgeInput = document.getElementById('student-age');
        const tutorSection = document.getElementById('tutor-section');
        const tutorInputs = tutorSection.querySelectorAll('input, select');
        const registrationForm = document.getElementById('registration-form');
        const messageContainer = document.getElementById('message-container');

        studentAgeInput.addEventListener('input', () => {
            const age = parseInt(studentAgeInput.value, 10);
            if (age < 18) {
                tutorSection.classList.add('visible');
                tutorInputs.forEach(input => input.required = true);
            } else {
                tutorSection.classList.remove('visible');
                tutorInputs.forEach(input => input.required = false);
            }
        });

        registrationForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = {
                nombreCompleto: document.getElementById('student-name').value,
                email: document.getElementById('student-email').value,
                password: document.getElementById('student-password').value,
                edad: parseInt(document.getElementById('student-age').value),
                cedula: document.getElementById('student-id').value,
                nombreTutor: document.getElementById('tutor-name').value,
                emailTutor: document.getElementById('tutor-email').value,
                parentesco: document.getElementById('tutor-relationship').value
            };
            
            try {
                const response = await fetch('/api/auth/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    // Si el registro es exitoso, redirigimos a la página de pago.
                    window.location.href = '/pago_transferencia.html';
                } else {
                    const errorMessage = await response.text();
                    throw new Error(errorMessage || "Ocurrió un error desconocido.");
                }
            } catch (error) {
                messageContainer.className = 'p-4 rounded-md text-sm bg-red-100 text-red-800';
                messageContainer.textContent = error.message;
                messageContainer.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
