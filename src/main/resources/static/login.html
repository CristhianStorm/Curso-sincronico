<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathlan - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f7f4; 
        }
        .login-card { 
            background-color: white; 
            border-radius: 0.75rem; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        }
        .btn-primary { 
            background-color: #0077b6; 
            color: white; 
            transition: background-color 0.3s ease; 
        }
        .btn-primary:hover { 
            background-color: #023e8a; 
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="login-card max-w-md w-full p-8">
            <div>
                <h1 class="text-2xl font-bold text-center text-gray-900">Bienvenido de Nuevo</h1>
                <p class="text-center text-gray-600 mt-2">Ingresa a tu cuenta para continuar.</p>
            </div>
            
            <form id="login-form" class="mt-8 space-y-6">
                <!-- Zona de Mensajes de Error/Éxito -->
                <div id="message-container" class="hidden p-4 rounded-md text-sm"></div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-900">Correo Electrónico</label>
                    <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#0077b6] focus:ring-[#0077b6] sm:text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-900">Contraseña</label>
                    <input type="password" id="password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#0077b6] focus:ring-[#0077b6] sm:text-sm">
                </div>
                
                <div>
                    <button type="submit" class="w-full btn-primary font-bold py-3 rounded-lg">Iniciar Sesión</button>
                </div>
                <p class="text-center text-sm text-gray-600">
                    ¿No tienes una cuenta? <a href="/registro.html" class="font-semibold text-[#0077b6] hover:underline">Regístrate aquí</a>.
                </p>
            </form>
        </div>
    </div>

    <!-- SCRIPT ACTUALIZADO CON LÓGICA DE REDIRECCIÓN COMPLETA -->
    <script>
        const loginForm = document.getElementById('login-form');
        const messageContainer = document.getElementById('message-container');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('jwtToken', data.token);

                    messageContainer.className = 'p-4 rounded-md text-sm bg-green-100 text-green-800';
                    messageContainer.textContent = 'Inicio de sesión exitoso. Redirigiendo...';
                    messageContainer.classList.remove('hidden');

                    // --- LÓGICA DE REDIRECCIÓN INTELIGENTE MEJORADA ---
                    setTimeout(() => {
                        // 1. Buscamos si hay una URL guardada para redirigir (ej: desde el foro)
                        const redirectUrl = localStorage.getItem('redirectAfterLogin');

                        if (redirectUrl) {
                            // 2. Si la hay, la usamos y la borramos para no usarla de nuevo
                            localStorage.removeItem('redirectAfterLogin');
                            window.location.href = redirectUrl;
                        } else {
                            // 3. Si no la hay, hacemos la redirección por rol de siempre
                            if (data.role === 'estudiante') {
                                window.location.href = '/dashboard_estudiante.html';
                            } else if (data.role === 'docente') {
                                window.location.href = '/dashboard_docente.html';
                            } else if (data.role === 'administrador') {
                                window.location.href = '/dashboard_admin.html';
                            } else {
                                // Fallback por si el rol no es reconocido
                                window.location.href = '/';
                            }
                        }
                    }, 1000); // Espera 1 segundo antes de redirigir

                } else {
                    const errorMessage = await response.text();
                    throw new Error(errorMessage || 'Credenciales incorrectas.');
                }
            } catch (error) {
                messageContainer.className = 'p-4 rounded-md text-sm bg-red-100 text-red-800';
                messageContainer.textContent = error.message;
                messageContainer.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
